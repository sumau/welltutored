# Runs on every pull request: deterministic repository verification, as
# defined by `pnpm run verify`, and the CI Smoke against the production image.
# Both are required checks, so keep their names. A merge to main runs
# deploy.yml instead, not these again.
# docs/pipeline.md is the description of what each gate covers and why;
# this file only supplies the environment they need.
#
# No Clerk credentials for `verify`: the
# suite is expected to pass with CLERK_SECRET_KEY,
# CLERK_PUBLISHABLE_KEY, and VITE_CLERK_PUBLISHABLE_KEY all absent, so giving
# CI secrets would weaken that guarantee rather than test it.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # ubuntu-latest is linux-x64/glibc. pnpm-workspace.yaml prunes every other
    # platform's native binaries (esbuild, lightningcss, @tailwindcss/oxide,
    # rollup) from the lockfile, so an arm runner or a musl container could not
    # resolve an install. Same constraint the dev image documents.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: welltutored
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d welltutored"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30

    env:
      # Both connections are set, and set differently, so the refusal in
      # backend/src/core/config.ts (databaseUrl()) to run integration tests
      # against the application database is exercised rather than trivially
      # satisfied by an absent DATABASE_URL.
      # Nothing writes to welltutored; it exists to be the URL the guard
      # compares against.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/welltutored
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/welltutored_test

    steps:
      - uses: actions/checkout@v7

      # No version here on purpose: the action reads the "packageManager" pin
      # from package.json, which docker/Dockerfile.dev also tracks. One pin,
      # three environments.
      - uses: pnpm/action-setup@v6

      # Must come after pnpm/action-setup so `cache: pnpm` can find the store.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # verify runs the integration tests against TEST_DATABASE_URL. The
      # database it names has to exist first: prepare:integration-database
      # applies a schema through drizzle-kit, which cannot create the database
      # that holds it.
      - name: Create the integration-test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE welltutored_test'

      # The steps and their order are `verify` in the root package.json.
      - name: Verify
        run: pnpm run verify

  # The CI Smoke: the Image Smoke (does the production image start and serve
  # the site?), then the browser Smokes against the same container. It builds
  # docker/Dockerfile itself, so it checks the image's recipe, not the exact
  # image Fly builds and ships (that one carries the pk_live_ key).
  ci-smoke:
    name: ci-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: welltutored
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d welltutored"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/welltutored

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the schema
        run: pnpm --filter @welltutored/backend run push

      # The API seeds sample content when it starts with NODE_ENV=development
      # on an empty database (docs/first-deploy.md). Start it once, wait until it
      # listens, and stop it: the database then has Tutors to smoke.
      - name: Seed sample content
        run: |
          pnpm --filter @welltutored/backend run build
          NODE_ENV=development PORT=8090 \
            node backend/dist/main.mjs > seed.log 2>&1 &
          pid=$!
          timeout 120 bash -c \
            "until grep -q 'Server listening' seed.log; do kill -0 $pid || exit 1; sleep 1; done" \
            || { cat seed.log; exit 1; }
          kill "$pid"

      # The Sign-in Smoke uses the Clerk development instance's keys, here and
      # nowhere else: `verify` stays free of Clerk secrets. A production key
      # would sign CI in to the Deployment's instance, so refuse one.
      - name: Check the Clerk keys are development keys
        env:
          CLERK_TEST_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          CLERK_TEST_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
        run: |
          case "$CLERK_TEST_PUBLISHABLE_KEY" in ""|pk_test_*) ;; *) echo "CLERK_TEST_PUBLISHABLE_KEY is not a pk_test_ key." >&2; exit 1 ;; esac
          case "$CLERK_TEST_SECRET_KEY" in ""|sk_test_*) ;; *) echo "CLERK_TEST_SECRET_KEY is not an sk_test_ key." >&2; exit 1 ;; esac

      - uses: docker/setup-buildx-action@v4

      # The development instance's publishable key, so sign-in works. Without
      # the secret (a pull request from a fork) it is empty, like the compose
      # `prod` service: the public site works, sign-in does not.
      # The GHA cache keeps the base image and pnpm layers between runs.
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          tags: welltutored:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Host networking, so the container reaches the postgres service on
      # localhost and serves on http://localhost:8080. TRUSTED_ORIGINS is that
      # origin, or the enquiry POST is rejected. Without the secret,
      # CLERK_SECRET_KEY falls back to the .env.example placeholder: without
      # any key, every /api request returns 500 (docs/local-docker.md, "Clerk").
      - name: Start the image
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY || 'sk_test_00000000000000000000000000000000' }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
        run: |
          docker run -d --name welltutored --network host \
            -e PORT=8080 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e TRUSTED_ORIGINS=http://localhost:8080 \
            -e CLERK_SECRET_KEY \
            -e CLERK_PUBLISHABLE_KEY \
            welltutored:ci
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors \
            http://localhost:8080/api/healthz

      - name: Development smoke
        env:
          SMOKE_BASE_URL: http://localhost:8080
        run: pnpm run smoke:launch:dev

      # It intercepts /api/enquiries, so it covers the built form in a real
      # browser; the development smoke covers the server's handling of an
      # invalid enquiry. The runner image carries Google Chrome.
      - name: Enquiry smoke
        env:
          SMOKE_BASE_URL: http://localhost:8080
        run: SMOKE_CHROMIUM_PATH="$(command -v google-chrome)" pnpm run smoke:enquiry

      # The Sign-in Smoke. It signs in as a +clerk_test user (a secret, since
      # this repository is public), promotes it to owner in this job's
      # database, and uses the Workspace. It runs last because it writes to
      # that database. On failure it saves a screenshot and a Playwright trace,
      # uploaded below. A pull request from a fork gets no secrets, so it can't
      # sign in: skip it there, with a notice. Dependabot runs read the
      # Dependabot copies of the secrets, so they run it.
      - name: Sign-in smoke skipped on a fork
        if: github.event.pull_request.head.repo.fork
        run: echo "::notice title=Sign-in Smoke skipped::A pull request from a fork gets no Clerk secrets, so the Sign-in Smoke can't sign in. It runs again once the change is on a branch of this repository."

      - name: Sign-in smoke
        id: sign-in-smoke
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          SMOKE_BASE_URL: http://localhost:8080
          SMOKE_SIGN_IN_EMAIL: ${{ secrets.CLERK_TEST_EMAIL }}
          SMOKE_DATABASE_URL: ${{ env.DATABASE_URL }}
          SMOKE_FAILURE_SCREENSHOT: ${{ runner.temp }}/sign-in-smoke/screenshot.png
          SMOKE_FAILURE_TRACE: ${{ runner.temp }}/sign-in-smoke/trace.zip
        run: |
          mkdir -p "$RUNNER_TEMP/sign-in-smoke"
          SMOKE_CHROMIUM_PATH="$(command -v google-chrome)" pnpm run smoke:sign-in

      - name: Upload the Sign-in Smoke failure
        if: failure() && steps.sign-in-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: sign-in-smoke-failure
          path: ${{ runner.temp }}/sign-in-smoke/
          if-no-files-found: ignore

      - name: Image logs
        if: failure()
        run: docker logs welltutored
