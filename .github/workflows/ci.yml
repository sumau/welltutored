# Deterministic repository verification, as defined by `pnpm run verify:ci`,
# the Image Smoke against the production image, and then the deploy.
# docs/ci-validation.md is the description of what each gate covers and why;
# this file only supplies the environment they need.
#
# No Clerk credentials for `verify`: the
# suite is expected to pass with CLERK_SECRET_KEY,
# CLERK_PUBLISHABLE_KEY, and VITE_CLERK_PUBLISHABLE_KEY all absent, so giving
# CI secrets would weaken that guarantee rather than test it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify:ci
    # ubuntu-latest is linux-x64/glibc. pnpm-workspace.yaml prunes every other
    # platform's native binaries (esbuild, lightningcss, @tailwindcss/oxide,
    # rollup) from the lockfile, so an arm runner or a musl container could not
    # resolve an install. Same constraint the dev image documents.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: welltutored
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d welltutored"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30

    env:
      # Both connections are set, and set differently, so lib/db/src/index.ts's
      # refusal to run integration tests against the application database is
      # exercised rather than trivially satisfied by an absent DATABASE_URL.
      # Nothing writes to welltutored; it exists to be the URL the guard
      # compares against.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/welltutored
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/welltutored_test

    steps:
      - uses: actions/checkout@v7

      # No version here on purpose: the action reads the "packageManager" pin
      # from package.json, which docker/Dockerfile.dev also tracks. One pin,
      # three environments.
      - uses: pnpm/action-setup@v6

      # Must come after pnpm/action-setup so `cache: pnpm` can find the store.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Supplying TEST_DATABASE_URL takes the short branch of
      # scripts/with-test-database.sh, which skips building a throwaway
      # cluster. The database it names has to exist first: prepare:test-database
      # applies a schema through drizzle-kit, which cannot create the database
      # that holds it.
      - name: Create the integration-test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE welltutored_test'

      # Runs the guard tests, the test-database checks, schema preparation, the
      # API suite (including the database-backed workspace lifecycle tests), the
      # web tests, the smoke-check tests, and finally `pnpm run build` — which
      # is where docs:check and the full typecheck live, so a doc edit that
      # would break the deployment build fails here instead.
      - name: Verify
        run: pnpm run verify:ci

  # The Image Smoke: does the production image start and serve the site? It
  # builds docker/Dockerfile itself, so it checks the image's recipe, not the
  # exact image Fly builds and ships (that one carries the pk_live_ key).
  image-smoke:
    name: Image Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: welltutored
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d welltutored"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/welltutored

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the schema
        run: pnpm --filter @workspace/db run push

      # The API seeds sample content when it starts with NODE_ENV=development
      # on an empty database (docs/first-deploy.md). Start it once, wait until it
      # listens, and stop it: the database then has Tutors to smoke.
      - name: Seed sample content
        run: |
          pnpm --filter @workspace/api-server run build
          NODE_ENV=development PORT=8090 \
            node artifacts/api-server/dist/index.mjs > seed.log 2>&1 &
          pid=$!
          timeout 120 bash -c \
            "until grep -q 'Server listening' seed.log; do kill -0 $pid || exit 1; sleep 1; done" \
            || { cat seed.log; exit 1; }
          kill "$pid"

      # The Sign-in Smoke uses the Clerk development instance's keys, here and
      # nowhere else: `verify` stays free of Clerk secrets. A production key
      # would sign CI in to the Deployment's instance, so refuse one.
      - name: Check the Clerk keys are development keys
        env:
          CLERK_TEST_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          CLERK_TEST_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
        run: |
          case "$CLERK_TEST_PUBLISHABLE_KEY" in ""|pk_test_*) ;; *) echo "CLERK_TEST_PUBLISHABLE_KEY is not a pk_test_ key." >&2; exit 1 ;; esac
          case "$CLERK_TEST_SECRET_KEY" in ""|sk_test_*) ;; *) echo "CLERK_TEST_SECRET_KEY is not an sk_test_ key." >&2; exit 1 ;; esac

      - uses: docker/setup-buildx-action@v4

      # The development instance's publishable key, so sign-in works. Without
      # the secret (a pull request from a fork or Dependabot) it is empty, like
      # the compose `prod` service: the public site works, sign-in does not.
      # The GHA cache keeps the base image and pnpm layers between runs.
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          tags: welltutored:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Host networking, so the container reaches the postgres service on
      # localhost and serves on http://localhost:8080. TRUSTED_ORIGINS is that
      # origin, or the enquiry POST is rejected. Without the secret,
      # CLERK_SECRET_KEY falls back to the .env.example placeholder: without
      # any key, every /api request returns 500 (docs/local-docker.md, "Clerk").
      - name: Start the image
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY || 'sk_test_00000000000000000000000000000000' }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
        run: |
          docker run -d --name welltutored --network host \
            -e PORT=8080 \
            -e DATABASE_URL="$DATABASE_URL" \
            -e TRUSTED_ORIGINS=http://localhost:8080 \
            -e CLERK_SECRET_KEY \
            -e CLERK_PUBLISHABLE_KEY \
            welltutored:ci
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors \
            http://localhost:8080/api/healthz

      - name: Development smoke
        env:
          SMOKE_BASE_URL: http://localhost:8080
        run: pnpm run smoke:dev

      # Not blocking yet: it moves through the form by tab order, so a harmless
      # markup change can fail it. It intercepts /api/enquiries, so it covers
      # the built form in a real browser; the development smoke covers the
      # server's handling of an invalid enquiry. The runner image carries
      # Google Chrome.
      - name: Enquiry browser smoke
        continue-on-error: true
        env:
          SMOKE_BASE_URL: http://localhost:8080
        run: SMOKE_CHROMIUM_PATH="$(command -v google-chrome)" pnpm run smoke:enquiry

      # The Sign-in Smoke. Not blocking yet, until it has proven reliable. It
      # signs in as a +clerk_test user (a secret, since this repository is
      # public), promotes it to owner in this job's database, and uses the
      # Workspace. It runs last because it writes to that database.
      - name: Sign-in smoke
        continue-on-error: true
        env:
          SMOKE_BASE_URL: http://localhost:8080
          SMOKE_SIGN_IN_EMAIL: ${{ secrets.CLERK_TEST_EMAIL }}
          SMOKE_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: SMOKE_CHROMIUM_PATH="$(command -v google-chrome)" pnpm run smoke:sign-in

      - name: Image logs
        if: failure()
        run: docker logs welltutored

  # Merging to main ships. Nothing else does: a pull request run stops at
  # `verify` and the Image Smoke, and `needs` keeps a failure in either from
  # deploying.
  deploy:
    name: deploy
    needs: [verify, image-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Its own group, and without cancel-in-progress. The workflow-level group
    # cancels superseded pull-request runs, which is right for verification and
    # wrong here: a cancelled deploy leaves the Deployment wherever flyctl had
    # got to. Queue them instead.
    concurrency:
      group: deploy-welltutored

    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # No build arguments: fly.toml already carries
      # VITE_CLERK_PUBLISHABLE_KEY under [build.args], which is where it
      # belongs — Vite compiles it into the browser bundle at build time, so a
      # Fly secret would not exist yet.
      #
      # This does not apply the schema. Pushing it is a deliberate, separate
      # act — see docs/adr/0002-schema-by-deliberate-push.md.
      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A Deploy succeeding does not mean the Deployment is usable. The launch
      # smoke is fetch-based, so no browser is needed here.
      #
      # SMOKE_REDIRECT_FROM is every other hostname the Deployment answers on;
      # each must redirect permanently to the Public Origin, so a lapsed
      # certificate or a broken DNS record fails here. SMOKE_CLERK_FRONTEND_API
      # is the Clerk production instance's CNAME, checked the same way.
      - name: Launch smoke
        env:
          SMOKE_BASE_URL: https://welltutored.co.uk
          SMOKE_CLERK_FRONTEND_API: https://clerk.welltutored.co.uk
          SMOKE_REDIRECT_FROM: >-
            https://www.welltutored.co.uk
            https://welltutored.com
            https://www.welltutored.com
            https://welltutored.fly.dev
        run: pnpm run smoke:launch
